<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<title>Tangga Level Mansoskul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --sunk:#EEF1F5; --ink:#17202E; --ink2:#4A5567; --ink3:#6B7585;
  --line:#DCE1E8; --navy:#1B3564; --navy2:#2B4F8C; --gold:#E0A21C; --mark:#FFE7A0;
  --l1:#4F6FA8; --l2:#14875A; --l3:#B97A0B; --l4:#C4522A; --l5:#9E3653; --l0:#737B88;
  --l1bg:#EAF0FA; --l2bg:#E3F4EC; --l3bg:#FBF1DC; --l4bg:#FBE9E2; --l5bg:#F7E5EB; --l0bg:#EEEFF2;
  --radius:14px; --shadow:0 1px 2px rgba(23,32,46,.06),0 4px 14px rgba(23,32,46,.05);
  --body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --head:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17.5px;line-height:1.65}
a{color:var(--navy2)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--head);line-height:1.25;color:var(--ink);letter-spacing:-.01em}
h1{font-size:1.85rem;font-weight:800;margin:.2em 0 .25em}
h2{font-size:1.35rem;font-weight:800;margin:1.6em 0 .5em}
h3{font-size:1.15rem;font-weight:700;margin:1.7em 0 .5em}
p{margin:.6em 0}
mark{background:linear-gradient(transparent 52%,var(--mark) 52%);color:inherit;padding:0 .1em}
.small{font-size:.9rem;color:var(--ink2)}
.lead{font-size:1.1rem;color:var(--ink)}
blockquote{margin:1em 0;padding:.6em 1em;border-left:4px solid var(--gold);background:var(--surface);border-radius:0 10px 10px 0;font-style:italic}
blockquote cite{display:block;font-style:normal;font-size:.9rem;color:var(--ink2);margin-top:.3em}
blockquote cite::before{content:"— "}

/* ---------- layout ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(6px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--head);font-weight:800;font-size:1.02rem;white-space:nowrap}
.brand span{display:block;font-size:.78rem;color:var(--ink3);line-height:1.2;white-space:nowrap}
.spacer{flex:1}
.modes{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.modes button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:.86rem;font-weight:700;cursor:pointer;color:var(--ink2);font-family:var(--head);white-space:nowrap}
.modes button[aria-pressed="true"]{background:var(--navy);color:#fff}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;cursor:pointer}
.wrap{display:grid;grid-template-columns:280px minmax(0,1fr);max-width:1240px;margin:0 auto}
nav.side{position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto;padding:18px 12px 40px 16px;border-right:1px solid var(--line)}
.side h4{font-size:.8rem;color:var(--ink3);margin:18px 8px 6px;font-weight:700}
.side a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:.95rem;line-height:1.3}
.side a:hover{background:var(--sunk)}
.side a[aria-current="page"]{background:var(--navy);color:#fff}
.side a[aria-current="page"] .lv{background:rgba(255,255,255,.18);color:#fff;border-color:transparent}
.side .dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--line);flex:none}
.side .dot.done{background:var(--l2);border-color:var(--l2)}
.side a .lbl{flex:1}
.lv{font-family:var(--head);font-size:.72rem;font-weight:800;border:1.5px solid currentColor;border-radius:6px;padding:0 5px;line-height:1.5}
main{padding:28px 20px 80px;min-width:0}
.page{max-width:720px;margin:0 auto}
.crumb{font-size:.86rem;color:var(--ink3);margin-bottom:2px}
.sub{color:var(--ink2);margin:0 0 1.2em;font-size:1.02rem}

@media (max-width:900px){
  .wrap{display:block}
  nav.side{position:fixed;inset:57px 0 0 0;height:auto;background:var(--surface);z-index:40;transform:translateX(-102%);transition:transform .22s ease;border-right:0;padding-bottom:80px}
  body.nav-open nav.side{transform:none}
  .menu-btn{display:inline-flex}
  .brand span{display:none}
  main{padding:20px 16px 90px}
}
@media (max-width:520px){
  body{font-size:17px}
  h1{font-size:1.55rem}
  .modes button{padding:6px 9px;font-size:.8rem}
  .brand b{font-size:.95rem}
  .top-in{gap:8px;padding:9px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- glossary term ---------- */
.term{border-bottom:2px dotted var(--navy2);cursor:help;color:inherit}
.term:hover,.term.on{background:var(--l1bg)}
#tip{position:fixed;z-index:60;max-width:min(340px,calc(100vw - 24px));background:var(--ink);color:#fff;border-radius:12px;padding:10px 13px;font-size:.92rem;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none}
#tip b{display:block;font-family:var(--head);color:var(--mark);margin-bottom:2px}

/* ---------- callouts ---------- */
aside.note,aside.key,aside.trap{border-radius:12px;padding:12px 16px;margin:1.2em 0;border:1px solid}
aside.note{background:var(--surface);border-color:var(--line)}
aside.key{background:var(--l2bg);border-color:#BFE3D1}
aside.trap{background:var(--l4bg);border-color:#F1C7B6}
aside b:first-child{font-family:var(--head)}
ol.steps{padding-left:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding-left:44px;margin:.8em 0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-family:var(--head);font-weight:800;display:grid;place-items:center;font-size:.9rem}
.plan{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.plan div{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.plan div:first-child{border-top:0}
.plan b{font-family:var(--head)}
.jpm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:.8em 0}
.jpm div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.jpm b{display:block;font-family:var(--head);font-size:1.1rem}
.jpm span{font-size:.88rem;color:var(--ink2)}
.contrast{display:grid;gap:10px;margin:1em 0}
.contrast>div{border-radius:12px;padding:10px 14px;border-left:6px solid}
.contrast .c1{background:var(--l1bg);border-color:var(--l1)}
.contrast .c2{background:var(--l2bg);border-color:var(--l2)}
.contrast .c3{background:var(--l3bg);border-color:var(--l3)}
.contrast b{font-family:var(--head)}
.contrast p{margin:.2em 0 0}

/* ---------- level tags ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--head);font-weight:800;font-size:.76rem;border-radius:999px;padding:2px 9px;white-space:nowrap}
.t0{background:var(--l0bg);color:var(--l0)} .t1{background:var(--l1bg);color:var(--l1)} .t2{background:var(--l2bg);color:var(--l2)}
.t3{background:var(--l3bg);color:var(--l3)} .t4{background:var(--l4bg);color:var(--l4)} .t5{background:var(--l5bg);color:var(--l5)}
.std{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;margin:.2em 0 1em}
.std .pill{font-size:.84rem;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px}
.std .pill b{font-family:var(--head)}

/* ---------- tangga (signature) ---------- */
.tangga{margin:1.2em 0 1.6em;display:flex;flex-direction:column-reverse;gap:6px}
.rung{position:relative;display:grid;grid-template-columns:var(--step) 1fr;align-items:stretch;cursor:pointer;border:0;background:none;text-align:left;padding:0;width:100%}
.rung .stair{border-radius:10px 0 0 10px;background:var(--c);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--head);font-weight:800;font-size:1.15rem;min-height:54px}
.rung .body{background:var(--surface);border:1px solid var(--line);border-left:0;border-radius:0 12px 12px 0;padding:9px 14px;min-width:0}
.rung .nm{font-family:var(--head);font-weight:700;font-size:.98rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rung .ks{font-size:.92rem;color:var(--ink2);margin-top:1px}
.rung .more{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:.93rem}
.rung .more ul{margin:.3em 0 0;padding-left:1.1em}
.rung[aria-expanded="true"] .more{display:block}
.rung.is2 .body{background:var(--l2bg);border-color:#BFE3D1}
.rung.is2 .stair{box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.rung:hover .body{border-color:#B9C2CF}
.r1{--c:var(--l1);--step:46px}.r2{--c:var(--l2);--step:62px}.r3{--c:var(--l3);--step:78px}.r4{--c:var(--l4);--step:94px}.r5{--c:var(--l5);--step:110px}
@media (max-width:520px){.r1{--step:38px}.r2{--step:48px}.r3{--step:58px}.r4{--step:68px}.r5{--step:78px}}
.hint{font-size:.85rem;color:var(--ink3);margin-top:-.4em}

/* radius rings */
.radius{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:18px;align-items:center;margin:1em 0 1.4em}
.radius svg{width:100%;height:auto;display:block}
.radius circle{cursor:pointer;transition:fill-opacity .15s}
.radius .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;min-height:220px}
.radius .panel h4{margin:.1em 0 .4em;font-size:1.05rem}
.radius .panel ul{margin:.3em 0;padding-left:1.1em;font-size:.93rem}
.lvbtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.lvbtns button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-family:var(--head);font-weight:800;font-size:.85rem;cursor:pointer}
.lvbtns button[aria-pressed="true"]{color:#fff;border-color:transparent}
@media (max-width:640px){.radius{grid-template-columns:1fr}.radius svg{max-width:260px;margin:0 auto}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:.4em 0 .9em}
.chip{font-size:.88rem;border-radius:999px;padding:3px 11px;border:1px solid var(--line);background:var(--surface)}
.kk{margin:.6em 0}
.kk .row{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.kk .row:first-child{border-top:0}

/* cards / grids */
.grid9{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:1em 0}
.k9{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.k9:hover{border-color:var(--navy2)}
.k9 b{font-family:var(--head);display:block;margin-bottom:2px}
.k9 span{font-size:.88rem;color:var(--ink2);display:block;line-height:1.45}
.k9 .tag{margin-top:6px}
.lvnames{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end;margin:1em 0}
.lvnames div{border-radius:10px 10px 4px 4px;color:#fff;padding:8px 6px;text-align:center;font-size:.8rem;line-height:1.3}
.lvnames b{display:block;font-family:var(--head);font-size:1.25rem}
@media (max-width:520px){.lvnames div{font-size:.7rem;padding:6px 3px}}
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden;font-size:.92rem;border:1px solid var(--line)}
.tbl th,.tbl td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:center}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{font-family:var(--head);font-size:.8rem;background:var(--sunk)}
.tbl .cur{background:var(--l2bg);font-weight:700}
.tbl thead .cur{background:var(--l2);color:#fff}
.tblwrap{overflow-x:auto;margin:.6em 0;border-radius:12px}

/* competency page */
.def{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;font-size:.96rem;color:var(--ink2)}
.def b{color:var(--ink);font-family:var(--head)}
.inti{font-family:var(--head);font-weight:800;font-size:1.25rem;line-height:1.35;margin:1em 0 .3em;color:var(--l2)}
ul.cth{padding-left:1.15em}
ul.cth li{margin:.25em 0}
dl.hafal{margin:.6em 0}
dl.hafal div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
dl.hafal dt{font-family:var(--head);font-weight:700}
dl.hafal dd{margin:.2em 0 0;color:var(--ink2);font-size:.95rem}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-family:var(--head);font-weight:700;font-size:.96rem;cursor:pointer;text-decoration:none;line-height:1.2}
.btn.pri{background:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy2)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{border-color:#B9C2CF}
.btn.ok{background:var(--l2);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:1.2em 0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:2.4em;padding-top:1.2em;border-top:1px solid var(--line);flex-wrap:wrap}
.pager a{flex:1;min-width:140px;text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;color:var(--ink)}
.pager a small{display:block;color:var(--ink3);font-size:.8rem}
.pager a b{font-family:var(--head);font-size:.95rem}
.pager a.nx{text-align:right}
.donebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:2em;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px}

/* walkthrough + options */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.q .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--ink3);margin-bottom:6px}
.q .sk{font-size:1.04rem;margin:.2em 0 .5em}
.q .ask{font-family:var(--head);font-weight:700;margin:.4em 0 .6em}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer;font-size:1rem;line-height:1.5}
.opt:hover:not([disabled]){border-color:var(--navy2);background:#FAFBFD}
.opt .ab{width:28px;height:28px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:.9rem}
.opt[disabled]{cursor:default}
.opt.struck .tx{text-decoration:line-through;text-decoration-color:rgba(23,32,46,.45);color:var(--ink3)}
.opt.struck{background:#FAFAFB}
.opt.win{border-color:var(--l2);background:var(--l2bg)}
.opt.pick{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset}
.opt.pickwrong{border-color:var(--l4);background:#FFF7F4}
.opt .why{grid-column:2;font-size:.9rem;color:var(--ink2);margin-top:4px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.opt .why .tag{flex:none}
.walkbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.walkbtns button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;cursor:pointer;font-family:var(--head);font-weight:700;font-size:.88rem}
.walkbtns button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.verdict{border-radius:12px;padding:12px 14px;margin:12px 0 4px;font-size:.98rem}
.verdict b{font-family:var(--head)}
.v-ok{background:var(--l2bg);border:1px solid #BFE3D1}
.v-mid{background:var(--l3bg);border:1px solid #EED9AE}
.v-bad{background:var(--l4bg);border:1px solid #F1C7B6}
.lesson{font-size:.93rem;color:var(--ink2);margin-top:8px}
.ladmini{display:inline-flex;gap:3px;align-items:flex-end;vertical-align:middle;margin-left:6px}
.ladmini i{display:block;width:10px;border-radius:2px;background:var(--line)}

/* quiz shell */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bar{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:var(--l2);border-radius:999px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:.6em 0 1em}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.86rem;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin:1em 0}
.qgrid button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--head);font-weight:700;font-size:.85rem;cursor:pointer}
.qgrid button.c{background:var(--l2bg);border-color:#9fd3b9;color:var(--l2)}
.qgrid button.w{background:var(--l4bg);border-color:#efbba6;color:var(--l4)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--ink2);cursor:pointer}
.drill .lvpick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.drill .lvpick button{border:0;border-radius:12px;padding:12px 0;font-family:var(--head);font-weight:800;font-size:1.1rem;cursor:pointer;color:#fff}
.drill .lvpick button[disabled]{opacity:.35;cursor:default}
.drill .lvpick button.right{opacity:1;box-shadow:0 0 0 3px var(--ink) inset}
.stmt{font-size:1.1rem;font-weight:700;font-family:var(--head);line-height:1.45;margin:.4em 0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:1em 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--head);font-size:1.5rem;line-height:1.1}
.stat span{font-size:.86rem;color:var(--ink2)}
.prog-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr 70px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.93rem}
.prog-row:first-child{border-top:0}
.prog-row .bar{height:10px}
.prog-row .num{text-align:right;font-family:var(--head);font-weight:700}
.timer{font-family:var(--head);font-weight:800;font-variant-numeric:tabular-nums;background:var(--sunk);border-radius:10px;padding:4px 10px}
.timer.low{background:var(--l4bg);color:var(--l4)}

/* bedakan */
.pair{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:14px 0;overflow:hidden}
.pair .pk{padding:9px 14px;background:var(--sunk);font-family:var(--head);font-weight:700;font-size:.95rem}
.pair .two{display:grid;grid-template-columns:1fr 1fr}
.pair .two>div{padding:10px 14px;font-size:.94rem}
.pair .two>div+div{border-left:1px solid var(--line)}
.pair .two b.h{display:block;font-family:var(--head);font-size:.88rem;margin-bottom:3px}
@media (max-width:560px){.pair .two{grid-template-columns:1fr}.pair .two>div+div{border-left:0;border-top:1px solid var(--line)}}

/* flashcards */
.flash{perspective:1200px;margin:1em 0}
.flash .card{position:relative;min-height:220px;border-radius:18px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s}
.flash .card.flip{transform:rotateY(180deg)}

.empty{background:var(--surface);border:1px dashed #C7CED8;border-radius:var(--radius);padding:20px;text-align:center;color:var(--ink2)}

.modechip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 14px;cursor:pointer;font-family:var(--head);font-size:.86rem;color:var(--ink)}

.modechip b{font-weight:800}

body.welcome nav.side,body.welcome .menu-btn,body.welcome .modes{display:none}
body.welcome .wrap{display:block}
.welcome-box{max-width:600px;margin:4vh auto 0}
.welcome-box h1{font-size:2.1rem;margin-top:.4em}
.modecards{display:grid;gap:10px;margin:1.2em 0}

.modecard span span{color:var(--ink2)}

.modecard[aria-checked="true"] .radio{border-color:var(--navy)}

.btn.big{padding:14px 22px;font-size:1.02rem}
.binpick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.binpick button{border:2px solid transparent;border-radius:12px;padding:14px 8px;font-family:var(--head);font-weight:800;font-size:1.05rem;cursor:pointer}
.binpick .yes{background:var(--l2);color:#fff}
.binpick .no{background:var(--surface);color:var(--ink);border-color:var(--line)}

.binpick button.wrong{opacity:.7;text-decoration:line-through}
.side a.important{background:var(--l3bg);border:1px solid #EED9AE;margin-bottom:6px}

.ask.step{display:block}
.stepno{display:inline-block;margin-right:8px;vertical-align:1px}

<div data-w="daftar9"></div>

<h3>5 level kemahiran</h3>
<p>Setiap kompetensi punya [[level|level profisiensi]] 1 sampai 5. Semakin tinggi levelnya, semakin luas tanggung jawab dan jangkauan perilakunya.</p>
<div data-w="levelnames"></div>

<h3>Standar untuk jabatanmu</h3>
<p>[[skj|Standar Kompetensi Jabatan]] menentukan level minimal per kompetensi. Tabel di bawah mengikuti mode yang kamu pilih. Untuk perbandingan, pejabat pengawas wajib Level 2 di semua kompetensi.</p>
<div data-w="standar"></div>
<aside class="key"><b>Yang perlu kamu pegang:</b> untuk JF Terampil, hanya <mark>Integritas, Kerja Sama, dan Perekat Bangsa</mark> yang wajib Level 2. Enam kompetensi lainnya standarnya Level 1. Menjawab Level 2 di semua kompetensi tetap aman. Titik rawanmu justru di tiga kompetensi tadi: jawaban Level 1 di sana berarti di bawah standar.</aside>

<h3>Bagaimana hasilnya dinilai</h3>
<p>Hasil tes dibandingkan dengan standar jabatan menjadi [[jpm|JPM]] (Job Person Match). Per BKN No. 26/2019:</p>
<div class="jpm"><div><b>≥ 90%</b><span>Optimal</span></div><div><b>78% – &lt;90%</b><span>Cukup optimal</span></div><div><b>&lt; 78%</b><span>Kurang optimal</span></div></div>
<p class="small">Pelaksana dan JF setara dinilai dengan tes kompetensi online. Struktural dan JF setara memakai [[ac|Assessment Center]].</p>
`},

kunci: { judul:"Bab 2 · Rumus membaca level", sub:"Satu alat untuk menebak level opsi mana pun dalam hitungan detik", isi:`
<p class="lead">Kalau kamu perhatikan kamus kompetensi, setiap kenaikan level hampir selalu berarti satu hal: <mark>jangkauan tindakan makin luas</mark>. Modul ini menyebutnya [[radius|radius dampak]].</p>

<div data-w="radius"></div>

<h3>Tiga pertanyaan untuk setiap opsi</h3>
<ol class="steps">
 <li><b>Siapa yang dijangkau tindakan ini?</b> Diri sendiri (L1), rekan atau kelompok kerja kecil (L2), unit yang dipimpin (L3), lintas unit atau instansi (L4), nasional (L5).</li>
 <li><b>Apakah tindakannya butuh kewenangan memimpin?</b> Kalau opsi itu menegur, mengapresiasi, membagi tugas tim, atau menetapkan target unit, itu peran pemimpin unit (L3 ke atas).</li>
 <li><b>Apakah tindakannya membangun sistem, program, atau kebijakan?</b> Kalau ya, hampir pasti L4 atau L5.</li>
</ol>

<h3>Ciri khas Level 2</h3>
<p>Level 2 punya rasa yang sama di semua kompetensi: <mark>proaktif dalam lingkup tugasku sendiri, dan menyentuh rekan di sekitarku</mark>. Aku tidak menunggu disuruh, aku tidak berhenti di diri sendiri, tetapi aku juga tidak bertindak seolah-olah pemimpin unit.</p>
<div class="contrast">
 <div class="c1"><b>Level 1</b><p>"Saya patuh. Saya ikut. Saya belajar." Benar, tapi untuk diri sendiri, atau menunggu arahan dan bimbingan.</p></div>
 <div class="c2"><b>Level 2</b><p>"Saya proaktif, lalu mengajak, membantu, menjelaskan, atau memberi contoh." Tanpa diarahkan, dan dalam kewenanganku.</p></div>
 <div class="c3"><b>Level 3</b><p>"Saya memastikan, menegur, mengapresiasi, memperbaiki standar unit." Bertindak sebagai pemimpin unit kerja.</p></div>
</div>

<h3>Kata kerja pengenal</h3>
<div data-w="katakerja"></div>
`},

sjt: { judul:"Bab 3 · Cara menjawab SJT", sub:"Eliminasi tiga langkah, dicoba langsung pada satu soal", isi:`
<p class="lead">Jangan langsung mencari jawaban yang "paling bagus", karena opsi Level 3 dan 4 sering terdengar paling hebat. Lebih aman <mark>membuang opsi yang salah dulu</mark>, satu per satu.</p>

<ol class="steps">
 <li><b>Buang yang keliru.</b> Opsi yang melanggar aturan atau etika, pasif ("menunggu arahan"), melempar ("lapor atasan tanpa klarifikasi"), terlalu keras, terlalu mengalah ("memenuhi permintaan agar cepat selesai"), atau mengambil alih pekerjaan orang lain.</li>
 <li><b>Buang yang [[ketinggian|ketinggian]].</b> Opsi dengan kata seperti <em>seluruh seksi/kantor/instansi, sistem, program, kebijakan, menegur anggota, menetapkan target unit, menjadi mediator, memetakan</em>.</li>
 <li><b>Buang yang [[kebawahan|kebawahan]].</b> Opsi yang benar tetapi hanya untuk diri sendiri, menunggu bimbingan, atau sekadar memenuhi standar.</li>
</ol>
<p>Yang tersisa biasanya opsi Level 2. Coba langsung pada soal berikut, ketuk tiap langkah:</p>
<div data-w="walk"></div>

<h3>Kalau masih ragu di antara dua opsi</h3>
<ul>
 <li>Pilih yang <b>tetap dalam kewenanganmu</b>. Kamu bukan kepala seksi.</li>
 <li>Pilih yang <b>ada tindakan nyata</b>, bukan sekadar memahami atau menerima.</li>
 <li>Pilih yang <b>menyentuh rekan atau pihak yang terlibat langsung</b>, bukan seluruh kantor.</li>
 <li>Perhatikan <b>kompetensi apa yang sedang diuji</b>. Membantu rekan belajar aplikasi baru bisa Level 2 di Kerja Sama, tetapi Level 3 di Mengelola Perubahan.</li>
</ul>

<aside class="trap"><b>Jebakan paling umum.</b> Opsi yang paling panjang dan paling "visioner" bukan otomatis yang benar. Di ujian Level 2, opsi yang terdengar seperti pidato kepala kantor biasanya justru jawaban ketinggian.</aside>
`},

integritas:{

 <blockquote>"Kurang cerdas dapat diperbaiki dengan belajar. Kurang cakap dapat diperbaiki dengan pengalaman. Namun, tidak jujur itu sulit diperbaiki." <cite>Bung Hatta</cite></blockquote>
 <p>Warren Buffett: carilah tiga kualitas, yaitu integritas, kecerdasan, dan energi. Tanpa yang pertama, dua lainnya akan "membunuhmu".</p>`,

kerjasama:{

<p class="lead">Senin nanti kamu mengerjakan [[sjt|SJT]] [[mansoskul|Mansoskul]] Level 2. Setiap soal berisi satu situasi kerja dengan <mark>6 pilihan tindakan yang semuanya terdengar benar</mark>. Tugasmu memilih satu yang <b>paling efektif</b>.</p>

<p>Karena ujiannya Level 2, semua situasi dan pilihan ada di lingkup Level 2: tindakanmu sendiri dalam situasi langsung, bersama rekan, atasan, atau wajib pajak. Tidak ada opsi soal kebijakan nasional atau membangun sistem kantor. Jadi yang diuji bukan "level berapa ini", tetapi <b>mana tindakan yang paling lengkap dan paling tepat</b>.</p>

<p>Kabar baiknya, pengecohnya berpola. Kalau kamu hafal 9 tipe pengecoh dan 4 ciri jawaban terbaik, 6 opsi yang awalnya mirip-mirip akan cepat tersaring.</p>

<h3>Cara memakai modul ini</h3>
<ol class="steps">
 <li><b>Baca Bab 2 dan Bab 3 lebih dulu.</b> Dua bab ini adalah inti modul: ciri jawaban terbaik dan tipe-tipe pengecoh.</li>
 <li><b>Latih mata dengan "Apa cacatnya?"</b> Satu opsi pengecoh muncul, kamu tebak tipenya. Cepat, beberapa detik per butir.</li>

 <li><b>Jaga progres lewat menu <a href="#/progres">Simpan progres</a>.</b></li>
</ol>

<h3>Rencana belajar sampai Senin</h3>

const fine=matchMedia("(hover:hover) and (pointer:fine)").matches;
document.addEventListener("mouseover",e=>{if(!fine)return;const t=e.target.closest(".term");if(t)showTip(t);});
document.addEventListener("mouseout",e=>{if(!fine)return;const t=e.target.closest(".term");if(t&&!t.contains(e.relatedTarget))hideTip();});
document.addEventListener("focusin",e=>{const t=e.target.closest(".term");if(t)showTip(t);});
document.addEventListener("focusout",e=>{if(e.target.closest(".term"))hideTip();});
addEventListener("scroll",()=>{if(tipEl&&!fine)hideTip();},{passive:true});
addEventListener("keydown",e=>{if(e.key==="Escape")hideTip();if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("term")){e.preventDefault();tipEl===e.target?hideTip():showTip(e.target);}});

// ---------- global clicks ----------
document.addEventListener("click",e=>{
  const t=e.target;
  const term=t.closest(".term"); if(term){e.preventDefault();e.stopPropagation(); if(tipEl===term&&!fine) hideTip(); else showTip(term); return;}
  if(tipEl&&!t.closest("#tip")) hideTip();
  const ln=t.closest('a[href^="#/"]'); if(ln){e.preventDefault();if(ln.dataset.restorefirst){ST.mode=SEL||ST.mode;ST.modeChosen=true;save();buildModes();buildNav();}go(ln.getAttribute("href").slice(2));return;}
  const mb=t.closest("[data-mode]"); if(mb){SEL=mb.dataset.mode;render();return;}
  if(t.closest("[data-gomode]")){BACK=CUR==="mode"?BACK:CUR;SEL=ST.mode;go("mode");return;}
  if(t.closest("[data-enter]")){const first=!ST.modeChosen;ST.mode=SEL||ST.mode;ST.modeChosen=true;SEL=null;save();buildModes();buildNav();go(first?"mulai":(BACK||"mulai"));toast("Mode: "+MODES[ST.mode].label);return;}
  if(t.closest("[data-cancelmode]")){SEL=null;go(BACK||"mulai");return;}
  if(t.closest(".menu-btn")){document.body.classList.toggle("nav-open");return;}
  const rung=t.closest(".rung"); if(rung){rung.setAttribute("aria-expanded",rung.getAttribute("aria-expanded")!=="true");return;}
  const dn=t.closest("[data-done]"); if(dn){const id=dn.dataset.done;ST.done[id]=!ST.done[id];if(!ST.done[id])delete ST.done[id];save();buildNav();
    if(ST.done[id]){const n=ORDER[ORDER.indexOf(id)+1];toast("Ditandai selesai");if(n){go(n);return;}} render();return;}
  const fb=t.closest("[data-f]"); if(fb){go("latihan"+(fb.dataset.f==="all"?"":"?k="+fb.dataset.f));return;}
  const qb=t.closest("[data-q]"); if(qb){const kf=qb.dataset.kf||(route().q.get("k")||"all");go("latihan/"+qb.dataset.q+"?k="+kf);return;}
  const pk=t.closest("[data-pick]"); if(pk&&!pk.disabled){const card=pk.closest(".q");const sid=+card.dataset.sid;const s=SOAL.find(x=>x.id===sid);const v=pk.dataset.pick;
    const P=PEND[sid]||{};
    if(!P.b){P.b=v;PEND[sid]=P;card.outerHTML=soalCard(s,optsOrder(sid),null,true);return;}
    if(P.b===v){delete PEND[sid];card.outerHTML=soalCard(s,optsOrder(sid),null,true);return;}
    ST.ans[sid]={b:P.b,w:v,ts:Date.now()};delete PEND[sid];save();buildNav();
    card.outerHTML=soalCard(s,optsOrder(sid),ST.ans[sid],true);
    const host=$("#main .page");const br=$(".btnrow",host);if(br&&!$("[data-retry]",br))br.insertAdjacentHTML("beforeend",`<button class="btn sec" data-retry="${sid}">Jawab ulang</button>`);
    const vd=$(".hasil",host);vd&&vd.scrollIntoView({behavior:"smooth",block:"start"});return;}
  const rr=t.closest("[data-retry]"); if(rr){const sid=+rr.dataset.retry;delete ST.ans[sid];delete PEND[sid];delete ORD[sid];save();buildNav();render();return;}
  const rs=t.closest("[data-reset]"); if(rs){const f=rs.dataset.reset;if(twoTap(rs)){SOAL.forEach(s=>{if(f==="all"||s.k===f){delete ST.ans[s.id];delete ORD[s.id];}});save();buildNav();render();}return;}
  // drill
  const df=t.closest("[data-df]"); if(df){$$("#drF button").forEach(b=>b.setAttribute("aria-pressed",b===df));drillStart(df.dataset.df);return;}
  const dl=t.closest("[data-dl]"); if(dl&&!dl.disabled){drillAnswer(dl.dataset.dl);return;}
  if(t.closest("[data-drnext]")){DR.i++;drillShow();return;}
  if(t.closest("[data-drnew]")){const m=($("#drF [aria-pressed=true]")||{}).dataset;drillStart(m?m.df:"mix");return;}
  // sim
  const sn=t.closest("#simN [data-n],#simT [data-t]"); if(sn){$$("button",sn.parentElement).forEach(b=>b.setAttribute("aria-pressed",b===sn));return;}
  if(t.closest("#simGo")){simBegin();return;}
  const sp=t.closest("[data-sp]"); if(sp&&SIM&&!SIM.end){const s=SIM.qs[SIM.i];const v=sp.dataset.sp;let a=SIM.ans[s.id]||{};if(full(a))a={};if(!a.b)a.b=v;else if(a.b===v)delete a.b;else{a.w=v;}SIM.ans[s.id]=a;if(full(a)&&SIM.i<SIM.qs.length-1){SIM.i++;} simShow();return;}
  const sg=t.closest("[data-sg]"); if(sg){SIM.i+= +sg.dataset.sg;simShow();return;}
  const sj=t.closest("[data-sj]"); if(sj){SIM.i=+sj.dataset.sj;simShow();return;}
  if(t.closest("[data-send]")){const un=SIM.qs.filter(x=>!full(SIM.ans[x.id])).length;if(un&&!twoTap(t.closest("[data-send]"),un+" soal belum dijawab. Ketuk lagi untuk selesai"))return;simFinish();window.scrollTo(0,0);return;}
  if(t.closest("[data-simnew]")){SIM=null;simMount();window.scrollTo(0,0);return;}
  // flash
  if(t.closest("#fc")){$("#fc").classList.toggle("flip");return;}
  if(t.closest("#fcNext")){ST.flashI=(ST.flashI+1)%KARTU.length;save();flashShow();return;}
  if(t.closest("#fcPrev")){ST.flashI=(ST.flashI-1+KARTU.length)%KARTU.length;save();flashShow();return;}
  if(t.closest("#fcShuf")){FC.order=shuffle(FC.order);ST.flashI=0;save();flashShow();toast("Urutan kartu diacak");return;}
  if(t.closest("#resetAll")){if(twoTap(t.closest("#resetAll"),"Ketuk lagi untuk menghapus semua")){ST={mode:ST.mode,modeChosen:true,done:{},ans:{},drill:{},flashI:0};save();buildNav();render();}return;}
  if(t.closest("#cpBtn")){const ta=$("#progCode");ta.value=progCode();
    const manual=()=>{ta.focus();ta.select();let ok=false;try{ok=document.execCommand("copy");}catch(x){}toast(ok?"Kode tersalin. Lanjut ke langkah 2.":"Salin manual: kode sudah terpilih");};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(()=>toast("Kode tersalin. Lanjut ke langkah 2."),manual);}else manual();return;}
  if(t.closest("#impBtn")){const raw=($("#impCode").value||"").replace(/\s+/g,"");if(!raw){toast("Kotak kode masih kosong");return;}
    try{const o=JSON.parse(decodeURIComponent(escape(atob(raw))));if(!o||typeof o!=="object"||!o.ans)throw 0;ST=Object.assign({mode:"terampil",done:{},ans:{},drill:{},flashI:0},o);ST.modeChosen=true;save();buildModes();buildNav();go("progres");toast("Progres berhasil dipulihkan");}catch(x){toast("Kode tidak dikenali. Pastikan seluruh kode tersalin.");}return;}
  if(t.closest("nav.side a")) document.body.classList.remove("nav-open");
});
addEventListener("keydown",e=>{const r=e.target.closest&&e.target.closest(".rung");if(r&&(e.key==="Enter"||e.key===" ")){e.preventDefault();r.setAttribute("aria-expanded",r.getAttribute("aria-expanded")!=="true");}});
addEventListener("keydown",e=>{ if(route().path!=="drill"||!DR||e.target.closest("input,textarea"))return; const n=+e.key; const d=DR.items[DR.i]; if(d&&n>=1&&n<=4) drillAnswer(drillChoices(d)[n-1]); });

// ---------- boot ----------
// special filter "salah" for ulang flow
const _ps=pageSoal;
pageSoal=function(id,q){const s=SOAL.find(x=>x.id===id);if(!s)return "";const f=q.get("k")||"all";
  if(f!=="salah") return _ps(id,q);
  // fixed list snapshot of wrong ones (+ current) so navigation stays stable
  pageSoal._snap=pageSoal._snap&&pageSoal._snap.includes(id)?pageSoal._snap:wrongList().map(x=>x.id);
  if(!pageSoal._snap.includes(id)) pageSoal._snap.push(id);
  const list=pageSoal._snap.map(i=>SOAL.find(x=>x.id===i)); const i=list.indexOf(s); const a=ST.ans[s.id];
  const prev=list[i-1], next=list[i+1];
  return `<div class="qhead"><a href="#/ulang" class="small">Ulang yang salah</a><div class="bar"><i style="width:${(i+1)/list.length*100}%"></i></div><span class="small">${i+1} / ${list.length}</span></div>
  ${full(a)&&score(s,a)<2?`<aside class="note" style="margin-top:0">Sebelumnya: paling efektif ${a.b==="best"?"tepat":"belum tepat"}, paling tidak efektif ${a.w===s.w?"tepat":"belum tepat"}. Jawab ulang dari awal.</aside>`:""}
  ${soalCard(s,optsOrder(s.id),full(a)&&score(s,a)===2?a:null,true)}
  <div class="btnrow">${prev?`<a class="btn sec" href="#/latihan/${prev.id}?k=salah">Sebelumnya</a>`:""}${next?`<a class="btn pri" href="#/latihan/${next.id}?k=salah">Berikutnya</a>`:`<a class="btn pri" href="#/ulang">Kembali ke ringkasan</a>`}</div>`;
};
const fromHash=()=>{const h=location.hash.replace(/^#\/?/,"");if(h&&h!==CUR){CUR=h;render();}};
addEventListener("hashchange",fromHash); addEventListener("popstate",fromHash);
{const h=location.hash.replace(/^#\/?/,""); if(!ST.modeChosen){CUR="mode";} else {CUR=h||(ST.last&&ST.last!=="mulai"?ST.last:"mulai"); if(!h&&CUR!=="mulai") setTimeout(()=>toast("Melanjutkan dari terakhir kali"),400);}}
buildModes(); buildNav();
render();
})();

</script>
</body>
</html>
